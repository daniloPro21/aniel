const genCode = () => {
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return 'AD-' + Array.from(crypto.getRandomValues(new Uint8Array(6)), (n) => A[n % A.length]).join('');
};

async function apiCall(path, opts) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!(res.headers.get('content-type') || '').includes('application/json')) throw new Error('NO_API');
  const data = await res.json();
  if (!res.ok) { const e = new Error(data.error || 'Une erreur est survenue.'); e.status = res.status; e.apiCode = data.code; throw e; }
  return data;
}
const apiMissing = (e) => IS_DEV && (e.message === 'NO_API' || e.apiCode === 'NO_DB' || e instanceof TypeError);

async function saveRsvp(f) {
  try {
    const d = await apiCall('/api/rsvp', { method: 'POST', body: JSON.stringify(f) });
    return { guest: d.guest, offline: false };
  } catch (e) {
    if (!apiMissing(e)) {
      if (e.message === 'NO_API' || e instanceof TypeError) throw new Error('Connexion impossible pour le moment. Vérifiez votre réseau et réessayez.');
      throw e;
    }
    const list = localDb.read();
    const email = f.email.trim().toLowerCase();
    let g = list.find((x) => x.email === email);
    const data = { nom: f.nom.trim(), prenom: f.prenom.trim(), email, presence: f.presence, personnes: f.presence === 'oui' ? Number(f.personnes) || 1 : 0, restrictions: f.restrictions.trim() };
    if (g) Object.assign(g, data); else { g = { code: genCode(), createdAt: new Date().toISOString(), ...data }; list.push(g); }
    localDb.write(list);
    return { guest: g, offline: true };
  }
}

async function findInvitation(q) {
  try {
    const d = await apiCall('/api/rsvp?q=' + encodeURIComponent(q.trim()));
    return { guest: d.guest, offline: false };
  } catch (e) {
    if (e.status === 404 && e.apiCode === 'NOT_FOUND') return null;
    if (!apiMissing(e)) {
      if (e.message === 'NO_API' || e instanceof TypeError) throw new Error('Connexion impossible pour le moment. Vérifiez votre réseau et réessayez.');
      throw e;
    }
    const v = q.trim().toLowerCase();
    const g = localDb.read().find((x) => x.email === v || x.code.toLowerCase() === v);
    return g ? { guest: g, offline: true } : null;
  }
}

/* --- Hooks --- */
function useCountdown(target) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);
  const diff = Math.max(0, new Date(target).getTime() - now);
  return { d: Math.floor(diff / 864e5), h: Math.floor(diff / 36e5) % 24, m: Math.floor(diff / 6e4) % 60, s: Math.floor(diff / 1e3) % 60, done: diff === 0 };
}

function useQr(code, stored, size = 600) {
  const [url, setUrl] = useState(stored || '');
  useEffect(() => {
    if (stored) { setUrl(stored); return; }
    let off = false;
    QRCode.toDataURL(`${baseUrl()}/?code=${encodeURIComponent(code)}`, {
      width: size, margin: 2, errorCorrectionLevel: 'M', color: { dark: '#0a3024', light: '#ffffff' }
    }).then((u) => { if (!off) setUrl(u); }).catch(() => {});
    return () => { off = true; };
  }, [code, stored]);
  return url;
}

function useInView(opts = { threshold: 0.18, rootMargin: '0px 0px -8% 0px' }) {
  const ref = useRef(null);
  const [on, setOn] = useState(REDUCED);
  useEffect(() => {
    const el = ref.current; if (!el || on) return;
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setOn(true); io.disconnect(); } }, opts);
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return [ref, on];
}

/* Parallaxe : tous les éléments [data-speed] bougent selon leur position dans l'écran */
function useParallax() {
  useEffect(() => {
    if (REDUCED) return;
    let raf = 0;
    const update = () => {
      raf = 0;
      const vh = window.innerHeight;
      document.querySelectorAll('[data-speed]').forEach((el) => {
        const r = (el.parentElement || el).getBoundingClientRect();
        if (r.bottom < -200 || r.top > vh + 200) return;
        const delta = (r.top + r.height / 2 - vh / 2) * parseFloat(el.dataset.speed);
        el.style.setProperty('--py', delta.toFixed(1) + 'px');
      });
    };
    const req = () => { if (!raf) raf = requestAnimationFrame(update); };
    update();
    window.addEventListener('scroll', req, { passive: true });
    window.addEventListener('resize', req);
    return () => { window.removeEventListener('scroll', req); window.removeEventListener('resize', req); cancelAnimationFrame(raf); };
  }, []);
}

/* Halo qui suit la souris + inclinaison 3D légère (souris uniquement) */
const spotMove = (tilt = 4) => (e) => {
  if (!FINE) return;
  const el = e.currentTarget, r = el.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  el.style.setProperty('--mx', x * 100 + '%'); el.style.setProperty('--my', y * 100 + '%');
  if (tilt && !REDUCED) el.style.transform = `perspective(1000px) rotateX(${(0.5 - y) * tilt}deg) rotateY(${(x - 0.5) * tilt}deg) translateY(-4px)`;
};
const spotLeave = (e) => { e.currentTarget.style.transform = ''; };

function Reveal({ as = 'div', dir = '', delay = 0, className = '', children, ...rest }) {
  const [ref, on] = useInView();
  return html`<${as} ref=${ref} style=${{ transitionDelay: delay + 'ms' }} className=${`reveal ${dir} ${on ? 'in' : ''} ${className}`} ...${rest}>${children}<//>`;
}

function Counter({ to, suffix }) {
  const [ref, on] = useInView({ threshold: 0.6 });
  const [v, setV] = useState(REDUCED ? to : 0);
  useEffect(() => {
    if (!on || REDUCED) return;
    const t0 = performance.now(), dur = 1600;
    let raf;
    const step = (t) => { const p = Math.min(1, (t - t0) / dur); setV(Math.round(to * (1 - Math.pow(1 - p, 4)))); if (p < 1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [on]);
  return html`<span ref=${ref} className="[font-variant-numeric:lining-nums_tabular-nums]">${v}${suffix}</span>`;
}

        <${SectionTitle} kick="Nos mots" title=${html`Ce qui nous a <em className="gold-text">portés</em>`} />

        <div className="mt-20 grid grid-cols-2 gap-px overflow-hidden rounded-[28px] border border-ivoire/10 bg-ivoire/10 md:grid-cols-4">
          ${NUMBERS.map((x, k) => html`
            <${Reveal} key=${k} delay=${k * 90} className="bg-nuit p-7 transition-colors duration-500 hover:bg-nuit-700 sm:p-9">
              <p className="font-display text-5xl font-light text-or-200 sm:text-6xl"><${Counter} to=${x.n} suffix=${x.suffix} /></p>
              <p className="mt-3 text-sm leading-snug text-ivoire/55">${x.label}</p>
            <//>`)}
        </div>

        <${Reveal} className="relative mx-auto mt-20 max-w-4xl">
          <div onMouseEnter=${() => setPause(true)} onMouseLeave=${(e) => { setPause(false); spotLeave(e); }}
            onTouchStart=${(e) => { touch.current = e.touches[0].clientX; }}
            onTouchEnd=${(e) => { const dx = e.changedTouches[0].clientX - touch.current; if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1); }}
            onMouseMove=${spotMove(2)}
            className="spot rounded-[32px] border border-ivoire/10 bg-gradient-to-br from-ivoire/[0.06] to-transparent px-7 py-14 text-center sm:px-16 sm:py-20" aria-live="polite">
            <span className="block font-display text-8xl leading-none text-or-400/40" aria-hidden="true">“</span>
            <div className="relative -mt-6 grid">
              ${WORDS.map((w, k) => html`
                <figure key=${k} className=${`col-start-1 row-start-1 transition-all duration-1000 ${k === i ? 'translate-y-0 opacity-100 blur-0' : 'pointer-events-none translate-y-6 opacity-0 blur-sm'}`} aria-hidden=${k !== i}>
                  <blockquote className="font-display text-3xl font-light italic leading-snug text-ivoire sm:text-[2.6rem]">${w.quote}</blockquote>
                  <figcaption className="mt-8">
                    <span className="text-sm font-medium text-or-200">${w.who}</span>
                    <span className="mx-3 text-ivoire/25">—</span>
                    <span className="text-sm text-ivoire/50">${w.when}</span>
                  </figcaption>
                </figure>`)}
            </div>
            <div className="mt-12 flex items-center justify-center gap-6">
              <button onClick=${() => go(-1)} aria-label="Citation précédente" className="flex h-11 w-11 items-center justify-center rounded-full border border-ivoire/15 text-ivoire/70 transition hover:border-or-300 hover:text-or-200">←</button>
              <div className="flex gap-2">
                ${WORDS.map((_, k) => html`<button key=${k} onClick=${() => setI(k)} aria-label=${`Citation ${k + 1}`}
                  className=${`h-1.5 rounded-full transition-all duration-700 ${k === i ? 'w-10 bg-or-300' : 'w-1.5 bg-ivoire/25 hover:bg-ivoire/50'}`}></button>`)}
              </div>
              <button onClick=${() => go(1)} aria-label="Citation suivante" className="flex h-11 w-11 items-center justify-center rounded-full border border-ivoire/15 text-ivoire/70 transition hover:border-or-300 hover:text-or-200">→</button>
            </div>
          </div>
        <//>
      </div>
    </section>`;
}

function Places() {
  const [i, setI] = useState(0);
  useEffect(() => {
    const h = (e) => setI(e.detail);
    window.addEventListener('open-place', h);
    return () => window.removeEventListener('open-place', h);
  }, []);
  const p = CONFIG.places[i];
  const q = encodeURIComponent(p.query);
  return html`
    <section id="lieux" className="relative bg-nuit-800 px-5 py-28 md:px-8 md:py-40">
      <div className="mx-auto max-w-6xl">
        <${SectionTitle} kick="Lieux & plan" title=${html`Deux adresses, <em className="gold-text">Kondengui</em>`}>
          <p>Choisissez le lieu pour afficher le plan et lancer l’itinéraire.</p>
        <//>

        <${Reveal} className="mt-12 flex justify-center">
          <div className="relative flex rounded-full border border-ivoire/10 bg-ivoire/[0.03] p-1" role="tablist">
            <span className="absolute bottom-1 top-1 rounded-full bg-or-300 transition-all duration-700" style=${{ left: i === 0 ? '4px' : '50%', width: 'calc(50% - 4px)', transitionTimingFunction: 'var(--ease)' }}></span>
            ${CONFIG.places.map((pl, k) => html`
              <button key=${pl.key} role="tab" aria-selected=${i === k} onClick=${() => setI(k)}
                className=${`relative z-10 w-40 rounded-full px-4 py-2.5 text-sm font-medium transition-colors duration-500 sm:w-52 ${i === k ? 'text-nuit' : 'text-ivoire/70 hover:text-ivoire'}`}>
                ${pl.label} · ${pl.time}
              </button>`)}
          </div>
        <//>

        <${Reveal} delay=${100} className="mt-10 grid overflow-hidden rounded-[32px] border border-ivoire/10 md:grid-cols-5">
          <div className="flex flex-col justify-between bg-gradient-to-br from-emeraude-900 to-nuit p-8 sm:p-10 md:col-span-2">
            <div key=${p.key} className="fade-in" style=${{ animationDuration: '.9s' }}>
              <p className=${kicker}>${p.label}</p>
              <p className="mt-4 font-display text-7xl font-light text-ivoire">${p.time}</p>
              <h3 className="mt-6 font-display text-3xl text-ivoire">${p.name}</h3>
              <p className="mt-2 text-sm text-ivoire/55">${p.address}</p>
              <p className="mt-1 text-sm text-ivoire/40">${EVENT_LONG}</p>
            </div>
            <div className="mt-10 flex flex-col gap-3">
              <a className=${btnPrimary} target="_blank" rel="noopener" href=${`https://www.google.com/maps/dir/?api=1&destination=${q}`}>Obtenir l’itinéraire</a>
              <a className=${btnGhost} target="_blank" rel="noopener" href=${`https://www.google.com/maps/search/?api=1&query=${q}`}>Ouvrir dans Google Maps</a>
            </div>
          </div>
          <iframe key=${p.key} title=${`Plan : ${p.name}`} loading="lazy" referrerPolicy="no-referrer-when-downgrade"
            className="map-dark h-[380px] w-full border-0 md:col-span-3 md:h-full md:min-h-[480px]"
            src=${`https://maps.google.com/maps?q=${q}&z=16&output=embed`}></iframe>
        <//>
      </div>
    </section>`;
}

/* --- Billet virtuel (rendu par ticket.js sur le visuel billet.jpg) --- */
function Ticket({ guest, offline }) {
  const qr = useQr(guest.code, guest.qr);
  const [img, setImg] = useState('');
  const [fail, setFail] = useState(false);
  useEffect(() => {
    if (!qr) return;
    let off = false;
    setFail(false);
    window.renderTicket(guest, qr).then((u) => { if (!off) setImg(u); }).catch(() => { if (!off) setFail(true); });
    return () => { off = true; };
  }, [qr, guest.code, guest.prenom, guest.nom, guest.personnes]);
  return html`
    <div>
      ${offline && html`<p className="mx-auto mb-6 max-w-md rounded-2xl border border-amber-300/30 bg-amber-300/10 px-4 py-3 text-center text-sm text-amber-100">Mode test : cette réponse est enregistrée uniquement sur cet appareil.</p>`}
      ${img
        ? html`<img id="ticket-print" src=${img} alt=${`Billet de ${guest.prenom} ${guest.nom}, code ${guest.code}`} className="fade-in mx-auto w-full max-w-3xl rounded-2xl shadow-[0_40px_100px_-30px_rgba(232,203,143,.45)] ring-1 ring-or-300/30" style=${{ animationDuration: '1.2s' }} />`
        : fail
          ? html`<div className="mx-auto max-w-xs text-center">${qr && html`<img src=${qr} alt=${`QR code ${guest.code}`} className="mx-auto h-56 w-56 rounded-xl bg-white p-2" />`}<p className="mt-3 font-semibold text-ivoire">${guest.code}</p></div>`
          : html`<div className="mx-auto aspect-[1820/872] w-full max-w-3xl animate-pulse rounded-2xl bg-ivoire/5"></div>`}

      <div className="mt-8 flex flex-wrap justify-center gap-3">
        <button onClick=${() => dl(img, `billet-annie-daniel-${guest.code}.png`)} disabled=${!img} className=${btnPrimary}>Télécharger le billet</button>
        <button onClick=${() => dl(qr, `qrcode-${guest.code}.png`)} disabled=${!qr} className=${btnGhost}>Télécharger le QR code</button>
        <button onClick=${() => window.print()} disabled=${!img} className=${btnGhost}>Imprimer</button>
      </div>
    </div>`;
}

function Field({ label, hint, children }) {
  return html`<label className="block"><span className="mb-2 block text-[11px] font-medium uppercase tracking-[0.2em] text-ivoire/55">${label}</span>${children}${hint && html`<span className="mt-1.5 block text-xs text-ivoire/40">${hint}</span>`}</label>`;
}

function Outcome({ res, onReset, resetLabel, onConfirm }) {
  const g = res.guest;
  const back = html`<p className="mt-10 text-center"><button onClick=${onReset} className="ulink text-sm text-ivoire/60 hover:text-ivoire">${resetLabel}</button></p>`;
  if (g.presence === 'attente' || g.presence === 'oui') {
    const pending = g.presence === 'attente';
    return html`
      <div>
        <div className="mb-10 text-center">
          <p className=${kicker}>${pending ? 'Votre invitation' : 'C’est confirmé'}</p>
          <h3 className="mt-4 font-display text-4xl font-light text-ivoire sm:text-5xl">${pending ? `Bienvenue, ${g.prenom}` : `Votre billet est prêt, ${g.prenom}`}</h3>
          <p className="mx-auto mt-4 max-w-md text-sm leading-relaxed text-ivoire/60">${pending
            ? 'Voici votre billet : le QR code vous sera demandé à l’entrée. Merci de nous confirmer votre présence.'
            : 'Téléchargez-le ou imprimez-le : le QR code vous sera demandé à l’entrée. Pour le retrouver, saisissez votre code ou votre e-mail dans « Retrouver mon billet ».'}</p>
          ${pending && html`<button onClick=${() => onConfirm(g)} className=${btnPrimary + ' mt-7'}>Confirmer ma présence</button>`}
        </div>
        <${Ticket} guest=${g} offline=${res.offline} />
        ${back}
      </div>`;
  }
  return html`
    <div className="mx-auto max-w-lg py-8 text-center">
      <p className="font-script text-6xl text-or-200">Merci</p>
      <h3 className="mt-4 font-display text-3xl font-light text-ivoire">${g.prenom}, vous serez dans nos pensées</h3>
      <p className="mt-4 text-sm leading-relaxed text-ivoire/60">Nous avons bien noté que vous ne pourrez pas être des nôtres le 12 décembre. Si votre situation change, renvoyez simplement le formulaire avec la même adresse e-mail.</p>
      <button onClick=${onReset} className=${btnGhost + ' mt-8'}>${resetLabel}</button>
    </div>`;
}

function Rsvp() {
  const [tab, setTab] = useState('rsvp');
  const [res, setRes] = useState(null);
  const empty = { prenom: '', nom: '', email: '', telephone: '', presence: 'oui', personnes: 1, restrictions: '', website: '', code: '' };
  const [f, setF] = useState(empty);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [q, setQ] = useState('');
  const [sErr, setSErr] = useState('');
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });

  const runSearch = async (val) => {
    setSErr('');
    if (!val.trim()) { setSErr('Saisissez votre code (AD-XXXXXX) ou votre e-mail.'); return; }
    setBusy(true);
    try {
      const r = await findInvitation(val);
      if (!r) setSErr('Aucune invitation trouvée. Vérifiez le code ou l’e-mail saisi, ou confirmez votre présence avec le formulaire.');
      else setRes(r);
    } catch (e) { setSErr(e.message); }
    finally { setBusy(false); }
  };

  useEffect(() => {
    const open = () => { setTab('search'); setRes(null); };
    window.addEventListener('open-search', open);
    const code = new URLSearchParams(location.search).get('code');
    if (code) {
      setTab('search'); setQ(code); runSearch(code);
      setTimeout(() => document.getElementById('rsvp')?.scrollIntoView({ behavior: 'smooth' }), REDUCED ? 0 : 2800);
    }
    return () => window.removeEventListener('open-search', open);
  }, []);

  const submit = async (e) => {
    e.preventDefault(); setErr('');
    if (!f.prenom.trim() || !f.nom.trim()) return setErr('Merci d’indiquer votre prénom et votre nom.');
    if (!EMAIL_RE.test(f.email.trim())) return setErr('Cette adresse e-mail semble invalide.');
    setBusy(true);
    try { setRes(await saveRsvp(f)); }
    catch (ex) { setErr(ex.message || 'Une erreur est survenue.'); }
    finally { setBusy(false); }
  };

  const reset = () => { setRes(null); setErr(''); setSErr(''); setF(empty); };
  const confirmInvite = (g) => {
    setF({ ...empty, prenom: g.prenom, nom: g.nom, email: g.email || '', personnes: g.personnes || 1, code: g.code });
    setRes(null); setErr(''); setTab('rsvp');
  };
  const deadline = new Date(CONFIG.rsvpDeadline);
  const showDeadline = deadline > new Date();
  const alert = (m) => html`<p role="alert" className="rounded-2xl border border-red-400/30 bg-red-500/10 px-4 py-3 text-sm text-red-100">${m}</p>`;

  return html`
    <section id="rsvp" className="relative overflow-hidden px-5 py-28 md:px-8 md:py-40">
      <div className="glow -left-40 top-20 h-[30rem] w-[30rem] bg-emeraude-700" aria-hidden="true"></div>
      <div className="glow -right-40 bottom-0 h-[26rem] w-[26rem] bg-brule-500/25" style=${{ animationDelay: '-9s' }} aria-hidden="true"></div>
      <div className="relative mx-auto max-w-4xl">
        <${SectionTitle} kick="Votre invitation" title=${html`Serez-vous <em className="gold-text">des nôtres ?</em>`}>
          <p>Confirmez votre présence pour recevoir votre billet nominatif avec QR code.${showDeadline ? ` Réponse souhaitée avant le ${fmtDate(CONFIG.rsvpDeadline, { day: 'numeric', month: 'long', year: 'numeric' })}.` : ''}</p>
        <//>

        <${Reveal} delay=${100} className="mt-16">
          <div className="rounded-[32px] border border-ivoire/10 bg-nuit-800/70 p-6 shadow-[0_50px_120px_-40px_rgba(0,0,0,.8)] backdrop-blur-xl sm:p-12">
            ${res
              ? html`<${Outcome} res=${res} onReset=${reset} onConfirm=${confirmInvite} resetLabel=${tab === 'rsvp' ? 'Modifier ma réponse ou inscrire une autre personne' : 'Faire une autre recherche'} />`
              : html`
                <div>
                  <div className="relative mx-auto mb-12 flex max-w-md rounded-full border border-ivoire/10 bg-ivoire/[0.03] p-1" role="tablist">
                    <span className="absolute bottom-1 top-1 rounded-full bg-or-300 transition-all duration-700" style=${{ left: tab === 'rsvp' ? '4px' : '50%', width: 'calc(50% - 4px)', transitionTimingFunction: 'var(--ease)' }}></span>
                    ${[['rsvp', 'Je confirme'], ['search', 'Retrouver mon billet']].map(([k, l]) => html`
                      <button key=${k} role="tab" aria-selected=${tab === k} onClick=${() => setTab(k)}
                        className=${`relative z-10 flex-1 rounded-full px-3 py-2.5 text-sm font-medium transition-colors duration-500 ${tab === k ? 'text-nuit' : 'text-ivoire/70 hover:text-ivoire'}`}>${l}</button>`)}
                  </div>

                  ${tab === 'rsvp' ? html`
                    <form onSubmit=${submit} noValidate className="mx-auto max-w-xl space-y-6">
                      ${f.code && html`<p className="rounded-2xl border border-or-300/25 bg-or-300/10 px-4 py-3 text-center text-sm text-or-100">Confirmation de l’invitation <strong>${f.code}</strong></p>`}
                      <div className="grid gap-6 sm:grid-cols-2">
                        <${Field} label="Prénom"><input className="field" value=${f.prenom} onChange=${set('prenom')} autoComplete="given-name" required /><//>
                        <${Field} label="Nom"><input className="field" value=${f.nom} onChange=${set('nom')} autoComplete="family-name" required /><//>
                      </div>
                      <div className="grid gap-6 sm:grid-cols-2">
                        <${Field} label="E-mail" hint="Il vous servira à retrouver votre billet."><input type="email" className="field" value=${f.email} onChange=${set('email')} autoComplete="email" required /><//>
                        <${Field} label="Téléphone (facultatif)"><input type="tel" className="field" value=${f.telephone} onChange=${set('telephone')} autoComplete="tel" /><//>
                      </div>

                      <fieldset>
                        <legend className="mb-2 text-[11px] font-medium uppercase tracking-[0.2em] text-ivoire/55">Serez-vous des nôtres ?</legend>
                        <div className="grid gap-3 sm:grid-cols-2">
                          ${[['oui', 'Avec joie, je serai là'], ['non', 'Je ne pourrai pas venir']].map(([v, l]) => html`
                            <label key=${v} className=${`flex cursor-pointer items-center gap-3 rounded-2xl border px-4 py-3.5 text-sm transition-all duration-500 ${f.presence === v ? 'border-or-300/70 bg-or-300/10 text-ivoire shadow-[0_0_30px_-10px_rgba(232,203,143,.5)]' : 'border-ivoire/10 text-ivoire/60 hover:border-ivoire/25'}`}>
                              <input type="radio" name="presence" value=${v} checked=${f.presence === v} onChange=${set('presence')} className="accent-[#E8CB8F]" />${l}
                            </label>`)}
                        </div>
                      </fieldset>

                      ${f.presence === 'oui' && html`
                        <div className="grid gap-6 sm:grid-cols-2">
                          <${Field} label="Personnes (vous inclus)">
                            <select className="field" value=${f.personnes} onChange=${set('personnes')}>${[1, 2, 3, 4, 5, 6].map((n) => html`<option key=${n} value=${n}>${n}</option>`)}</select>
                          <//>
                          <${Field} label="Restrictions alimentaires"><input className="field" value=${f.restrictions} onChange=${set('restrictions')} placeholder="Allergies, régime, etc." /><//>
                        </div>`}

                      <input type="text" name="website" value=${f.website} onChange=${set('website')} tabIndex="-1" autoComplete="off" aria-hidden="true" className="absolute -left-[9999px] h-0 w-0 opacity-0" />

                      ${err && alert(err)}
                      <div className="pt-2 text-center">
                        <button type="submit" disabled=${busy} className=${btnPrimary}>${busy ? 'Envoi en cours…' : 'Envoyer ma réponse'}</button>
                        <p className="mt-4 text-xs text-ivoire/40">Pour modifier votre réponse, renvoyez le formulaire avec la même adresse e-mail.</p>
                      </div>
                    </form>`
                  : html`
                    <form onSubmit=${(e) => { e.preventDefault(); runSearch(q); }} className="mx-auto max-w-xl space-y-6">
                      <${Field} label="Votre code ou votre e-mail" hint="Le code figure sur votre billet, par exemple AD-7K3M9Q.">
                        <input className="field" value=${q} onChange=${(e) => setQ(e.target.value)} placeholder="AD-XXXXXX ou nom@exemple.com" autoComplete="email" />
                      <//>
                      ${sErr && alert(sErr)}
                      <div className="text-center"><button type="submit" disabled=${busy} className=${btnPrimary}>${busy ? 'Recherche…' : 'Retrouver mon billet'}</button></div>
                    </form>`}
                </div>`}
          </div>
        <//>
      </div>
    </section>`;
}

function Footer() {
  return html`
    <footer className="relative overflow-hidden border-t border-ivoire/10 px-5 pb-10 pt-24 md:px-8">
      <div className="mx-auto max-w-6xl">
        <${Reveal} className="text-center">
          <p className="font-display text-xl italic text-or-200/90">« Les cordons à trois brins ne se rompent pas facilement. »</p>
          <p className="mt-2 text-xs uppercase tracking-[0.3em] text-ivoire/40">Ecclésiaste 4:12</p>
        <//>
        <div className="mt-16 overflow-hidden">
          <p className="select-none text-center font-script text-[clamp(4.5rem,18vw,15rem)] leading-[1.1] gold-text" data-speed="-0.05">Annie & Daniel</p>
        </div>
        <div className="mt-12 flex flex-col items-center justify-between gap-6 border-t border-ivoire/10 pt-8 text-sm text-ivoire/50 md:flex-row">
          <p>${EVENT_LONG} · Kondengui, Yaoundé</p>
          <ul className="flex flex-wrap justify-center gap-6">
            ${[['programme', 'Programme'], ['histoire', 'Histoire'], ['lieux', 'Lieux'], ['rsvp', 'Invitation']].map(([id, l]) => html`<li key=${id}><a href=${'#' + id} className="ulink hover:text-ivoire">${l}</a></li>`)}
          </ul>
          <a href="#accueil" className="ulink hover:text-ivoire">Retour en haut ↑</a>
        </div>
        <p className="mt-8 text-center text-xs text-ivoire/30">Avec tout notre amour, merci de faire partie de notre histoire.</p>
      </div>
    </footer>`;
}

function App() {
  useParallax();
  return html`<${Fragment}><${Nav} /><main><${Hero} /><${Marquee} /><${Programme} /><${Timeline} /><${Words} /><${Places} /><${Rsvp} /></main><${Footer} /><//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
