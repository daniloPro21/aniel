  #curtain { animation: curtain 2.4s ease forwards; }

  .flight-reveal { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 4.6s 1.8s linear forwards; }

  .plane { opacity: 0; animation: appear .2s 1.8s forwards; }
  .pin { opacity: 0; animation: appear 1s 6.2s forwards; }
  @keyframes appear { to { opacity: 1; } }

const LS_KEY = 'annie-daniel-rsvps-v1';
const localDb = {
  read() { try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch { return []; } },
  write(a) { try { localStorage.setItem(LS_KEY, JSON.stringify(a)); } catch {} }
};
const genCode = () => {
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return 'AD-' + Array.from(crypto.getRandomValues(new Uint8Array(6)), (n) => A[n % A.length]).join('');
};

async function apiCall(path, opts) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!(res.headers.get('content-type') || '').includes('application/json')) throw new Error('NO_API');
  const data = await res.json();
  if (!res.ok) { const e = new Error(data.error || 'Une erreur est survenue.'); e.status = res.status; e.apiCode = data.code; throw e; }
  return data;
}
const apiMissing = (e) => IS_DEV && (e.message === 'NO_API' || e.apiCode === 'NO_DB' || e instanceof TypeError);

async function saveRsvp(f) {
  try {
    const d = await apiCall('/api/rsvp', { method: 'POST', body: JSON.stringify(f) });
    return { guest: d.guest, offline: false };
  } catch (e) {
    if (!apiMissing(e)) {
      if (e.message === 'NO_API' || e instanceof TypeError) throw new Error('Connexion impossible pour le moment. Vérifiez votre réseau et réessayez.');
      throw e;
    }
    const list = localDb.read();
    const email = f.email.trim().toLowerCase();
    let g = list.find((x) => x.email === email);
    const data = { nom: f.nom.trim(), prenom: f.prenom.trim(), email, presence: f.presence, personnes: f.presence === 'oui' ? Number(f.personnes) || 1 : 0, restrictions: f.restrictions.trim() };
    if (g) Object.assign(g, data); else { g = { code: genCode(), createdAt: new Date().toISOString(), ...data }; list.push(g); }
    localDb.write(list);
    return { guest: g, offline: true };
  }
}

async function findInvitation(q) {
  try {
    const d = await apiCall('/api/rsvp?q=' + encodeURIComponent(q.trim()));
    return { guest: d.guest, offline: false };
  } catch (e) {
    if (e.status === 404 && e.apiCode === 'NOT_FOUND') return null;
    if (!apiMissing(e)) {
      if (e.message === 'NO_API' || e instanceof TypeError) throw new Error('Connexion impossible pour le moment. Vérifiez votre réseau et réessayez.');
      throw e;
    }
    const v = q.trim().toLowerCase();
    const g = localDb.read().find((x) => x.email === v || x.code.toLowerCase() === v);
    return g ? { guest: g, offline: true } : null;
  }
}

/* --- Hooks --- */
function useCountdown(target) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);
  const diff = Math.max(0, new Date(target).getTime() - now);
  return { d: Math.floor(diff / 864e5), h: Math.floor(diff / 36e5) % 24, m: Math.floor(diff / 6e4) % 60, s: Math.floor(diff / 1e3) % 60, done: diff === 0 };
}

function useQr(code, stored, size = 600) {
  const [url, setUrl] = useState(stored || '');
  useEffect(() => {
    if (stored) { setUrl(stored); return; }
    let off = false;
    QRCode.toDataURL(`${baseUrl()}/?code=${encodeURIComponent(code)}`, {
      width: size, margin: 2, errorCorrectionLevel: 'M', color: { dark: '#0a3024', light: '#ffffff' }
    }).then((u) => { if (!off) setUrl(u); }).catch(() => {});
    return () => { off = true; };
  }, [code, stored]);
  return url;
}

function Reveal({ as = 'div', dir = 'up', delay = 0, className = '', children }) {
  const ref = useRef(null);
  const [on, setOn] = useState(false);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setOn(true); io.disconnect(); } }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return html`<${as} ref=${ref} style=${{ transitionDelay: delay + 'ms' }} className=${`reveal reveal-${dir} ${on ? 'in' : ''} ${className}`}>${children}<//>`;
}

function Rsvp() {
  const [tab, setTab] = useState('rsvp');
  const [res, setRes] = useState(null);
  const empty = { prenom: '', nom: '', email: '', telephone: '', presence: 'oui', personnes: 1, restrictions: '', website: '', code: '' };
  const [f, setF] = useState(empty);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [q, setQ] = useState('');
  const [sErr, setSErr] = useState('');
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });

  const runSearch = async (val) => {
    setSErr('');
    if (!val.trim()) { setSErr('Saisissez votre code (AD-XXXXXX) ou votre e-mail.'); return; }
    setBusy(true);
    try {
      const r = await findInvitation(val);
      if (!r) setSErr('Aucune invitation trouvée. Vérifiez le code ou l’e-mail saisi, ou confirmez votre présence avec le formulaire.');
      else setRes(r);
    } catch (e) { setSErr(e.message); }
    finally { setBusy(false); }
  };

  useEffect(() => {
    const open = () => { setTab('search'); setRes(null); };
    window.addEventListener('open-search', open);
    const code = new URLSearchParams(location.search).get('code');
    if (code) {
      setTab('search'); setQ(code); runSearch(code);
      setTimeout(() => document.getElementById('rsvp')?.scrollIntoView({ behavior: 'smooth' }), 2600);
    }
    return () => window.removeEventListener('open-search', open);
  }, []);

  const submit = async (e) => {
    e.preventDefault(); setErr('');
    if (!f.prenom.trim() || !f.nom.trim()) return setErr('Merci d’indiquer votre prénom et votre nom.');
    if (!EMAIL_RE.test(f.email.trim())) return setErr('Cette adresse e-mail semble invalide.');
    setBusy(true);
    try { setRes(await saveRsvp(f)); }
    catch (ex) { setErr(ex.message || 'Une erreur est survenue.'); }
    finally { setBusy(false); }
  };

  const reset = () => { setRes(null); setErr(''); setSErr(''); setF(empty); };
  const confirmInvite = (g) => {
    setF({ ...empty, prenom: g.prenom, nom: g.nom, email: g.email || '', personnes: g.personnes || 1, code: g.code });
    setRes(null); setErr(''); setTab('rsvp');
  };
  const deadline = new Date(CONFIG.rsvpDeadline);
  const showDeadline = deadline > new Date();

  return html`
    <section id="rsvp" className="bg-emeraude-900 px-5 py-24">
      <div className="mx-auto max-w-4xl">
        <div className="text-center text-white">
          <h2 className="font-display text-4xl sm:text-5xl">Votre invitation</h2>
          <p className="mx-auto mt-3 max-w-md text-sm text-white/75">
            Confirmez votre présence pour recevoir votre billet avec QR code.${showDeadline ? ` Réponse souhaitée avant le ${fmtDate(CONFIG.rsvpDeadline, { day: 'numeric', month: 'long', year: 'numeric' })}.` : ''}
          </p>
        </div>

        <div className="mt-10 rounded-3xl bg-white p-5 shadow-2xl sm:p-10">
          ${res
            ? html`<${Outcome} res=${res} onReset=${reset} onConfirm=${confirmInvite} resetLabel=${tab === 'rsvp' ? 'Modifier ma réponse ou inscrire une autre personne' : 'Faire une autre recherche'} />`
            : html`
              <div>
                <div className="mx-auto mb-8 flex max-w-md rounded-full bg-emeraude-50 p-1" role="tablist">
                  ${[['rsvp', 'Je confirme ma présence'], ['search', 'Retrouver mon invitation']].map(([k, l]) => html`
                    <button key=${k} role="tab" aria-selected=${tab === k} onClick=${() => setTab(k)}
                      className=${`flex-1 rounded-full px-3 py-2.5 text-sm font-medium transition ${tab === k ? 'bg-emeraude-900 text-white shadow' : 'text-emeraude-900 hover:bg-emeraude-100'}`}>${l}</button>`)}
                </div>

                ${tab === 'rsvp' ? html`
                  <form onSubmit=${submit} noValidate className="mx-auto max-w-xl space-y-5">
                    ${f.code && html`<p className="rounded-xl bg-emeraude-50 px-4 py-3 text-center text-sm text-emeraude-900">Confirmation de l’invitation <strong>${f.code}</strong></p>`}
                    <div className="grid gap-5 sm:grid-cols-2">
                      <${Field} label="Prénom"><input className=${inputCls} value=${f.prenom} onChange=${set('prenom')} autoComplete="given-name" required /><//>
                      <${Field} label="Nom"><input className=${inputCls} value=${f.nom} onChange=${set('nom')} autoComplete="family-name" required /><//>
                    </div>
                    <div className="grid gap-5 sm:grid-cols-2">
                      <${Field} label="E-mail" hint="Il vous servira à retrouver votre billet."><input type="email" className=${inputCls} value=${f.email} onChange=${set('email')} autoComplete="email" required /><//>
                      <${Field} label="Téléphone (facultatif)"><input type="tel" className=${inputCls} value=${f.telephone} onChange=${set('telephone')} autoComplete="tel" /><//>
                    </div>

                    <fieldset>
                      <legend className="mb-1.5 text-sm font-medium text-emeraude-900">Serez-vous des nôtres ?</legend>
                      <div className="grid gap-3 sm:grid-cols-2">
                        ${[['oui', 'Avec joie, je serai là'], ['non', 'Je ne pourrai pas venir']].map(([v, l]) => html`
                          <label key=${v} className=${`cursor-pointer rounded-xl border-2 px-4 py-3 text-sm font-medium transition ${f.presence === v ? 'border-or-500 bg-or-500/10 text-emeraude-900' : 'border-emeraude-900/15 text-emeraude-900/70 hover:border-or-500/50'}`}>
                            <input type="radio" name="presence" value=${v} checked=${f.presence === v} onChange=${set('presence')} className="mr-2 accent-emeraude-700" />${l}
                          </label>`)}
                      </div>
                    </fieldset>

                    ${f.presence === 'oui' && html`
                      <div className="grid gap-5 sm:grid-cols-2">
                        <${Field} label="Nombre de personnes (vous inclus)">
                          <select className=${inputCls} value=${f.personnes} onChange=${set('personnes')}>${[1, 2, 3, 4, 5, 6].map((n) => html`<option key=${n} value=${n}>${n}</option>`)}</select>
                        <//>
                        <${Field} label="Restrictions alimentaires"><input className=${inputCls} value=${f.restrictions} onChange=${set('restrictions')} placeholder="Allergies, régime, etc." /><//>
                      </div>`}

                    <input type="text" name="website" value=${f.website} onChange=${set('website')} tabIndex="-1" autoComplete="off" aria-hidden="true" className="absolute -left-[9999px] h-0 w-0 opacity-0" />

                    ${err && html`<p role="alert" className="rounded-xl bg-red-50 px-4 py-3 text-sm text-red-800">${err}</p>`}
                    <div className="text-center">
                      <button type="submit" disabled=${busy} className=${btnPrimary}>${busy ? 'Envoi en cours…' : 'Envoyer ma réponse'}</button>
                      <p className="mt-3 text-xs text-emeraude-900/55">Pour modifier votre réponse, renvoyez le formulaire avec la même adresse e-mail.</p>
                    </div>
                  </form>`
                : html`
                  <form onSubmit=${(e) => { e.preventDefault(); runSearch(q); }} className="mx-auto max-w-xl space-y-5">
                    <${Field} label="Votre code ou votre e-mail" hint="Le code figure sur votre billet, par exemple AD-7K3M9Q.">
                      <input className=${inputCls} value=${q} onChange=${(e) => setQ(e.target.value)} placeholder="AD-XXXXXX ou nom@exemple.com" autoComplete="email" />
                    <//>
                    ${sErr && html`<p role="alert" className="rounded-xl bg-red-50 px-4 py-3 text-sm text-red-800">${sErr}</p>`}
                    <div className="text-center"><button type="submit" disabled=${busy} className=${btnPrimary}>${busy ? 'Recherche…' : 'Retrouver mon invitation'}</button></div>
                  </form>`}
              </div>`}
        </div>
      </div>
    </section>`;
}

function Footer() {
  return html`
    <footer className="bg-emeraude-950 px-5 py-16 text-center text-white">
      <p className="font-script text-6xl gold-text">Annie & Daniel</p>
      <p className="mt-3 font-display text-lg text-white/85">${EVENT_LONG}</p>
      <p className="mx-auto mt-6 max-w-md font-display text-base italic text-or-300">« Les cordons à trois brins ne se rompent pas facilement. »</p>
      <p className="mt-1 text-xs text-white/60">Ecclésiaste 4:12</p>
      <p className="mt-10 text-xs text-white/50">Avec tout notre amour, merci de faire partie de notre histoire.</p>
    </footer>`;
}

function App() {
  return html`<${Fragment}><${Nav} /><main><${Hero} /><${Programme} /><${Timeline} /><${Places} /><${Rsvp} /></main><${Footer} /><//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
