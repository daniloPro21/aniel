  html, body { background: #03110C; }

      radial-gradient(60rem 40rem at 110% -10%, rgba(19,128,99,.22), transparent 60%),
      radial-gradient(50rem 40rem at -20% 110%, rgba(192,149,77,.10), transparent 60%), #03110C; }
  .card { border: 1px solid rgba(245,239,227,.08); background: linear-gradient(180deg, rgba(245,239,227,.045), rgba(245,239,227,.02)); border-radius: 24px; }
  .gold-text { background: linear-gradient(100deg,#B98A3E,#F3DFA8 35%,#C0954D 60%,#F3DFA8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .field { width: 100%; border-radius: 14px; border: 1px solid rgba(245,239,227,.12); background: rgba(245,239,227,.04); padding: .75rem 1rem; font-size: .9rem; color: #F5EFE3; transition: border-color .3s, box-shadow .3s; }
  .field::placeholder { color: rgba(245,239,227,.35); }
  .field:focus { outline: none; border-color: rgba(232,203,143,.7); box-shadow: 0 0 0 4px rgba(232,203,143,.12); }
  select.field option { background: #051A13; color: #F5EFE3; }
  select.field option:disabled { color: rgba(245,239,227,.3); }
  .scroll-thin::-webkit-scrollbar { width: 6px; height: 6px; } .scroll-thin::-webkit-scrollbar-thumb { background: rgba(232,203,143,.25); border-radius: 9px; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .rise { animation: rise .6s cubic-bezier(.16,1,.3,1) both; }

<script>
const { useState, useEffect, useRef, useCallback, useMemo, Fragment } = React;
const html = htm.bind(React.createElement);

/* =====================================================================
   Infos reprises dans le message WhatsApp
   ===================================================================== */
const EVENT = {
  date: '2026-12-12T12:00:00+01:00',
  jour: 'Samedi 12 décembre 2026',
  benediction: '12h00 · Bénédiction · Plein Évangile, Assemblée de Kondengui',
  soiree: '20h00 · Soirée dansante · El Pathenco, Kondengui',
};

const KEY_STORE = 'ad-admin-key';
const getKey = () => { try { return sessionStorage.getItem(KEY_STORE) || ''; } catch { return ''; } };
const setKey = (k) => { try { k ? sessionStorage.setItem(KEY_STORE, k) : sessionStorage.removeItem(KEY_STORE); } catch {} };

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'x-admin-key': getKey(), ...(opts.headers || {}) } });
  const data = (res.headers.get('content-type') || '').includes('application/json') ? await res.json() : {};
  if (!res.ok) { const e = new Error(data.error || 'Une erreur est survenue.'); e.status = res.status; throw e; }
  return data;
}

const fold = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const plural = (n, w) => `${n} ${w}${n > 1 ? 's' : ''}`;
const fmtTime = (iso) => new Date(iso).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const initials = (g) => ((g.prenom || '')[0] || '') + ((g.nom || '')[0] || '');
const NAMES = {};   // numéro de table -> nom (lieux de la Bible), rempli à chaque chargement
const tableLabel = (n) => n ? `${n} · ${NAMES[n] || 'Table ' + n}` : '';
const PERSONNES = [[1, 'Seul(e)'], [2, 'En couple']];
const inviteLink = (code) => `${location.origin}/?code=${code}`;

const STATUS = {
  oui: ['Confirmé', 'bg-emeraude-400/15 text-emeraude-300 ring-emeraude-400/30'],
  attente: ['À confirmer', 'bg-or-300/10 text-or-200 ring-or-300/25'],
  non: ['Absent', 'bg-red-500/10 text-red-300 ring-red-400/25'],
};

/* --- WhatsApp : numéro au format international + messages --- */
function waNumber(tel) {
  let d = String(tel || '').replace(/[^\d+]/g, '');
  if (d.startsWith('+')) d = d.slice(1); else if (d.startsWith('00')) d = d.slice(2);
  else if (/^6\d{8}$/.test(d)) d = '237' + d;                 // mobile camerounais sans indicatif
  else if (/^0[67]\d{8}$/.test(d)) d = '33' + d.slice(1);     // mobile français 06 / 07
  return d.replace(/\D/g, '');
}

const MESSAGES = [
  { label: 'Chaleureux', build: (g, p) => [
    `Bonjour ${g.prenom} 🤍`,
    '',
    `C’est avec le cœur rempli de joie que nous vous annonçons notre mariage ! Après cinq belles années, nous allons nous dire « Oui » devant Dieu, et ce serait un immense bonheur de vous avoir à nos côtés pour vivre ce moment avec nous. 💍`,
    '',
    `📅 *${EVENT.jour}*`,
    `⛪ ${EVENT.benediction}`,
    `🥂 ${EVENT.soiree}`,
    '',
    `🎟️ Votre billet personnel${p.pers} :`,
    p.link,
    `Code : *${g.code}*`,
    p.table && `🍽️ Vous serez installé${p.e} à la table *${p.tname}* (n° ${g.table}).`,
    '',
    `Gardez bien ce message : le QR code de votre billet vous sera demandé à l’entrée.`,
    '',
    `Avec toute notre affection,`,
    `Annie & Daniel ✨`,
  ] },
  { label: 'Élégant', build: (g, p) => [
    `Bonjour ${g.prenom},`,
    '',
    `Annie & Daniel, ainsi que leurs familles, ont l’immense joie de vous inviter à la célébration de leur mariage, le ${EVENT.jour.toLowerCase()} à Yaoundé.`,
    '',
    `La bénédiction nuptiale aura lieu à 12h00 à l’Assemblée Plein Évangile de Kondengui, et sera suivie d’une soirée dansante à 20h00 à El Pathenco.`,
    '',
    `Votre billet nominatif${p.pers} : ${p.link}`,
    `Code d’invitation : ${g.code}`,
    p.table && `Votre table : ${p.tname} (n° ${g.table})`,
    '',
    `Votre présence sera pour nous le plus beau des cadeaux.`,
    `Annie & Daniel`,
  ] },
  { label: 'Court', build: (g, p) => [
    `${g.prenom}, vous êtes invité${p.e} à notre mariage le 12 décembre 2026 ! 🎉💍`,
    `Votre billet${p.pers} : ${p.link}`,
    `Code : ${g.code}${p.table ? ` · Table ${p.tname}` : ''}`,
    `On a tellement hâte de vous voir ! Annie & Daniel 🤍`,
  ] },
];
function buildMessage(g, variant) {
  const n = g.personnes || 1;
  const p = { link: inviteLink(g.code), pers: n > 1 ? ` (valable pour ${n} personnes)` : '', table: Boolean(g.table), tname: g.tableName || NAMES[g.table] || g.table, e: n > 1 ? 's' : '(e)' };
  return MESSAGES[variant].build(g, p).filter((l) => l !== false && l !== null && l !== undefined)
    .join('\n').replace(/\n{3,}/g, '\n\n');
}

/* =====================================================================
   Petits composants
   ===================================================================== */
const ICONS = {
  home: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
  users: 'M16 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M22 19v-1a4 4 0 0 0-3-3.87M16 3.13a3.5 3.5 0 0 1 0 6.75',
  table: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
  scan: 'M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10',
  plus: 'M12 5v14M5 12h14',
  search: 'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3',
  ticket: 'M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4zM13 6v12',
  edit: 'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z',
  trash: 'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6',
  download: 'M12 3v12M7 10l5 5 5-5M5 21h14',
  copy: 'M9 9h11v11H9zM5 15H4V4h11v1',
  logout: 'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9',
  chat: 'M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.5A8.5 8.5 0 1 1 21 11.5z',
  sparkle: 'M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6',
  share: 'M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v14',
  check: 'M20 6 9 17l-5-5',
  x: 'M18 6 6 18M6 6l12 12',
  csv: 'M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h8',
};
const Icon = ({ name, className = 'h-4 w-4' }) => html`
  <svg viewBox="0 0 24 24" className=${className} fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d=${ICONS[name]} /></svg>`;

const btnGold = 'inline-flex items-center justify-center gap-2 rounded-full bg-gradient-to-r from-or-500 via-or-300 to-or-500 bg-[length:200%_auto] px-5 py-2.5 text-sm font-semibold text-nuit shadow-[0_10px_30px_-12px_rgba(232,203,143,.7)] transition-all duration-500 hover:bg-right active:scale-[.98] disabled:opacity-50';
const btnLine = 'inline-flex items-center justify-center gap-2 rounded-full border border-ivoire/15 px-4 py-2.5 text-sm font-medium text-ivoire/85 transition hover:border-or-300/50 hover:text-ivoire active:scale-[.98] disabled:opacity-40';
const btnWa = 'inline-flex items-center justify-center gap-2 rounded-full bg-[#25D366] px-5 py-2.5 text-sm font-semibold text-[#06251B] shadow-[0_10px_30px_-12px_rgba(37,211,102,.7)] transition hover:brightness-110 active:scale-[.98] disabled:opacity-50';
const iconBtn = 'inline-flex h-9 w-9 items-center justify-center rounded-full text-ivoire/60 transition hover:bg-ivoire/10 hover:text-ivoire';
const kicker = 'text-[10px] font-medium uppercase tracking-[0.3em] text-or-300/75';

const Status = ({ p }) => { const [l, c] = STATUS[p] || STATUS.attente; return html`<span className=${'whitespace-nowrap rounded-full px-2.5 py-1 text-[11px] font-medium ring-1 ' + c}>${l}</span>`; };
const TablePill = ({ n }) => n
  ? html`<span className="tnum inline-flex items-center gap-1 whitespace-nowrap rounded-full bg-or-300/10 px-2.5 py-1 text-[11px] font-semibold text-or-200 ring-1 ring-or-300/25">${tableLabel(n)}</span>`
  : html`<span className="whitespace-nowrap rounded-full px-2.5 py-1 text-[11px] text-ivoire/40 ring-1 ring-dashed ring-ivoire/15">Sans table</span>`;
const PaperPill = ({ on }) => on && html`<span className="whitespace-nowrap rounded-full bg-ivoire/10 px-2.5 py-1 text-[11px] font-medium text-ivoire/80 ring-1 ring-ivoire/20">Billet papier</span>`;
const Avatar = ({ g }) => html`
  <span className="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-gradient-to-br from-emeraude-700 to-emeraude-900 font-display text-base uppercase text-or-200 ring-1 ring-or-300/25">${initials(g)}</span>`;

function Modal({ onClose, children, wide }) {
  useEffect(() => {
    const k = (e) => e.key === 'Escape' && onClose();
    window.addEventListener('keydown', k); document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', k); document.body.style.overflow = ''; };
  }, []);
  return html`
    <div className="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-black/70 p-3 backdrop-blur-sm sm:p-6" onClick=${onClose}>
      <div className=${'pop relative my-4 w-full rounded-[28px] border border-ivoire/10 bg-nuit-800 p-5 shadow-[0_40px_120px_-30px_rgba(0,0,0,.9)] sm:p-7 ' + (wide ? 'max-w-4xl' : 'max-w-lg')} onClick=${(e) => e.stopPropagation()}>
        <button onClick=${onClose} className=${iconBtn + ' absolute right-3 top-3'} aria-label="Fermer"><${Icon} name="x" /></button>
        ${children}
      </div>
    </div>`;
}

function Bar({ value, max, tone = 'gold' }) {
  const pct = max ? Math.min(100, (value / max) * 100) : 0;
  const c = tone === 'gold' ? 'from-or-500 to-or-200' : tone === 'green' ? 'from-emeraude-500 to-emeraude-300' : 'from-red-500 to-red-300';
  return html`<div className="h-1.5 overflow-hidden rounded-full bg-ivoire/10"><div className=${'h-full rounded-full bg-gradient-to-r transition-all duration-700 ' + c} style=${{ width: pct + '%' }}></div></div>`;
}

/* =====================================================================
   Billet + partage WhatsApp
   ===================================================================== */
function ShareModal({ code, onClose, onChanged, toast }) {
  const [g, setG] = useState(null);
  const [img, setImg] = useState('');
  const [err, setErr] = useState('');
  const [variant, setVariant] = useState(0);
  const [msg, setMsg] = useState('');
  useEffect(() => {
    api('/api/guests?code=' + encodeURIComponent(code)).then((d) => setG(d.guest)).catch((e) => setErr(e.message));
  }, [code]);
  useEffect(() => {
    if (!g) return;
    setMsg(buildMessage(g, variant));
  }, [g, variant]);
  useEffect(() => {
    if (!g) return;
    window.renderTicket(g, g.qr).then(setImg).catch(() => setErr('Impossible de dessiner le billet.'));
  }, [g]);

  const markShared = async () => {
    try { const d = await api('/api/guests', { method: 'POST', body: JSON.stringify({ action: 'shared', code }) }); setG((x) => ({ ...x, sharedAt: d.sharedAt })); onChanged(); } catch {}
  };
  const sendWa = () => {
    const num = waNumber(g.telephone);
    window.open(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
    markShared();
  };
  const shareImage = async () => {
    try {
      const blob = await (await fetch(img)).blob();
      const file = new File([blob], `billet-annie-daniel-${code}.png`, { type: 'image/png' });
      await navigator.share({ files: [file], text: msg });
      markShared();
    } catch (e) { if (e && e.name !== 'AbortError') toast('Partage impossible sur cet appareil.'); }
  };
  const copy = async () => {
    try { await navigator.clipboard.writeText(msg); toast('Message copié'); } catch { toast('Copie impossible'); }
  };
  const canShareFiles = typeof navigator.canShare === 'function' && window.matchMedia('(pointer: coarse)').matches;

  return html`
    <${Modal} onClose=${onClose} wide>
      ${err && html`<p className="mb-4 rounded-2xl bg-red-500/10 px-4 py-3 text-sm text-red-200">${err}</p>`}
      ${!g ? !err && html`<div className="h-64 animate-pulse rounded-2xl bg-ivoire/5"></div>` : html`
        <div className="flex flex-wrap items-center gap-3 pr-10">
          <${Avatar} g=${g} />
          <div className="min-w-0">
            <p className="font-display text-2xl leading-tight">${g.prenom} ${g.nom}</p>
            <p className="tnum text-xs text-ivoire/50">${g.code} · ${plural(g.personnes || 1, 'personne')}${g.telephone ? ' · ' + g.telephone : ''}</p>
          </div>
          <div className="flex flex-wrap gap-2 sm:ml-auto"><${TablePill} n=${g.table} /><${Status} p=${g.presence} /><${PaperPill} on=${g.billetPhysique} />
            ${g.respondedAt && html`<span className="rounded-full bg-ivoire/5 px-2.5 py-1 text-[11px] text-ivoire/60 ring-1 ring-ivoire/10">Réponse en ligne ${fmtTime(g.respondedAt)}</span>`}
            ${g.sharedAt && html`<span className="rounded-full bg-[#25D366]/10 px-2.5 py-1 text-[11px] text-[#7ee2a6] ring-1 ring-[#25D366]/30">Envoyé ${fmtTime(g.sharedAt)}</span>`}</div>
        </div>

        <div className="mt-6 grid gap-6 lg:grid-cols-[1.25fr_1fr]">
          <div>
            ${img ? html`<img src=${img} alt=${`Billet ${code}`} className="w-full rounded-2xl ring-1 ring-or-300/30" />`
                  : html`<div className="aspect-[1820/872] w-full animate-pulse rounded-2xl bg-ivoire/5"></div>`}
            <div className="mt-3 flex flex-wrap gap-2">
              <button className=${btnLine + ' !py-2'} disabled=${!img} onClick=${() => window.downloadUrl(img, `billet-annie-daniel-${code}.png`)}><${Icon} name="download" />Billet</button>
              <button className=${btnLine + ' !py-2'} onClick=${() => window.downloadUrl(g.qr, `qrcode-${code}.png`)}><${Icon} name="download" />QR code</button>
            </div>
            <p className="mt-3 break-all text-xs text-ivoire/40">${inviteLink(g.code)}</p>
          </div>

          <div className="flex flex-col">
            <div className="mb-2 flex items-center justify-between gap-2">
              <p className=${kicker}>Message WhatsApp</p>
              <div className="flex rounded-full border border-ivoire/10 p-0.5">
                ${MESSAGES.map((m, i) => html`<button key=${m.label} onClick=${() => setVariant(i)}
                  className=${'rounded-full px-3 py-1 text-[11px] transition ' + (variant === i ? 'bg-or-300 font-semibold text-nuit' : 'text-ivoire/60 hover:text-ivoire')}>${m.label}</button>`)}
              </div>
            </div>
            <textarea className="field scroll-thin min-h-[16rem] flex-1 resize-y text-[13px] leading-relaxed" value=${msg} onChange=${(e) => setMsg(e.target.value)}></textarea>
            ${!g.telephone && html`<p className="mt-2 text-xs text-or-200/80">Pas de numéro enregistré : WhatsApp vous laissera choisir le contact.</p>`}
            <div className="mt-4 flex flex-wrap gap-2">
              <button className=${btnWa + ' flex-1'} onClick=${sendWa}><${Icon} name="chat" />Envoyer sur WhatsApp</button>
              ${canShareFiles && html`<button className=${btnLine} disabled=${!img} onClick=${shareImage}><${Icon} name="share" />Billet en image</button>`}
              <button className=${btnLine} onClick=${copy}><${Icon} name="copy" />Copier</button>
            </div>
          </div>
        </div>`}
    <//>`;
}

/* =====================================================================
   Ajout / modification d'un invité
   ===================================================================== */
function TableSelect({ plan, value, personnes, selfCode, onChange }) {
  return html`
    <select className="field" value=${value || ''} onChange=${(e) => onChange(e.target.value)}>
      <option value="">Pas encore de table</option>
      ${plan.list.map((t) => {
        const mine = t.guests.filter((x) => x.code === selfCode).reduce((n, x) => n + (x.personnes || 1), 0);
        const free = plan.seats - t.used + mine;
        return html`<option key=${t.n} value=${t.n} disabled=${free < personnes && String(value) !== String(t.n)}>${t.n} · ${t.name} — ${free > 0 ? plural(free, 'place') + ' libre' + (free > 1 ? 's' : '') : 'complète'}</option>`;
      })}
    </select>`;
}

function GuestForm({ guest, plan, onClose, onSaved }) {
  const editing = Boolean(guest);
  const [f, setF] = useState(() => guest
    ? { prenom: guest.prenom, nom: guest.nom, personnes: guest.personnes || 1, telephone: guest.telephone || '', table: guest.table || '', presence: guest.presence || 'attente', billetPhysique: Boolean(guest.billetPhysique) }
    : { prenom: '', nom: '', personnes: 1, telephone: '', table: '', presence: 'attente', billetPhysique: false });
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const set = (k) => (e) => setF({ ...f, [k]: e && e.target ? e.target.value : e });

  const submit = async (e, share) => {
    e.preventDefault(); setErr('');
    if (!f.prenom.trim() || !f.nom.trim()) return setErr('Prénom et nom requis.');
    setBusy(true);
    try {
      const body = JSON.stringify({ ...f, personnes: Number(f.personnes), table: f.table || null });
      const d = editing
        ? await api('/api/guests?code=' + encodeURIComponent(guest.code), { method: 'PATCH', body })
        : await api('/api/guests', { method: 'POST', body });
      onSaved(d.guest, !editing);
    } catch (ex) { setErr(ex.message); setBusy(false); }
  };

  const L = ({ t, children, className = '' }) => html`<label className=${'block ' + className}><span className="mb-1.5 block text-[11px] font-medium uppercase tracking-[0.18em] text-ivoire/50">${t}</span>${children}</label>`;
  return html`
    <${Modal} onClose=${onClose}>
      <p className=${kicker}>${editing ? guest.code : 'Nouvel invité'}</p>

      <form onSubmit=${submit} className="mt-6 space-y-4">
        <div className="grid gap-4 sm:grid-cols-2">
          ${L({ t: 'Prénom', children: html`<input className="field" value=${f.prenom} onChange=${set('prenom')} placeholder="ex. Jean" autoFocus />` })}
          ${L({ t: 'Nom', children: html`<input className="field" value=${f.nom} onChange=${set('nom')} />` })}
          ${L({ t: 'Téléphone WhatsApp', children: html`<input type="tel" className="field" value=${f.telephone} onChange=${set('telephone')} placeholder="6 XX XX XX XX ou +33 6…" />` })}
          ${L({ t: 'Nombre de personnes', children: html`<select className="field" value=${f.personnes} onChange=${set('personnes')}>${PERSONNES.map(([n, l]) => html`<option key=${n} value=${n}>${l} (${n})</option>`)}</select>` })}
          ${L({ t: 'Table', children: html`<${TableSelect} plan=${plan} value=${f.table} personnes=${Number(f.personnes)} selfCode=${guest && guest.code} onChange=${set('table')} />` })}
          ${L({ t: 'Statut', children: html`<select className="field" value=${f.presence} onChange=${set('presence')}>${Object.entries(STATUS).map(([k, [l]]) => html`<option key=${k} value=${k}>${l}</option>`)}</select>` })}
        </div>
        <label className="flex cursor-pointer items-center gap-3 rounded-2xl border border-ivoire/10 bg-ivoire/[0.03] px-4 py-3 transition hover:border-or-300/30">
          <input type="checkbox" className="h-4 w-4 accent-[#E8CB8F]" checked=${f.billetPhysique} onChange=${(e) => setF({ ...f, billetPhysique: e.target.checked })} />
          <span className="text-sm"><span className="font-medium">Billet physique remis</span><span className="block text-xs text-ivoire/45">Cochez si un billet papier a été donné en main propre.</span></span>
        </label>
        ${err && html`<p className="rounded-2xl bg-red-500/10 px-4 py-3 text-sm text-red-200">${err}</p>`}
        <div className="flex flex-wrap justify-end gap-2 pt-2">
          <button type="button" className=${btnLine} onClick=${onClose}>Annuler</button>
          <button type="submit" className=${btnGold} disabled=${busy}>${busy ? 'Enregistrement…' : editing ? 'Enregistrer' : 'Créer le billet'}</button>
        </div>
      </form>
    <//>`;
}

   ===================================================================== */
function Donut({ parts, size = 132 }) {
  const total = parts.reduce((n, p) => n + p.v, 0) || 1;
  const r = 52, C = 2 * Math.PI * r;
  let acc = 0;
  return html`
    <svg viewBox="0 0 120 120" width=${size} height=${size} className="-rotate-90">
      <circle cx="60" cy="60" r=${r} fill="none" stroke="rgba(245,239,227,.08)" strokeWidth="12" />
      ${parts.map((p) => { const len = (p.v / total) * C; const el = html`<circle key=${p.l} cx="60" cy="60" r=${r} fill="none" stroke=${p.c} strokeWidth="12" strokeDasharray=${`${len} ${C - len}`} strokeDashoffset=${-acc} strokeLinecap="butt" />`; acc += len; return el; })}
    </svg>`;
}

function Stat({ label, value, sub, children, delay = 0 }) {
  return html`
    <div className="card rise p-5" style=${{ animationDelay: delay + 'ms' }}>
      <p className=${kicker}>${label}</p>
      <p className="tnum mt-3 font-display text-5xl font-light leading-none text-ivoire">${value}</p>
      ${sub && html`<p className="mt-2 text-xs text-ivoire/50">${sub}</p>`}
      ${children && html`<div className="mt-4">${children}</div>`}
    </div>`;
}

  const candidates = data.guests.filter((g) => !g.table && g.presence !== 'non' && (g.personnes || 1) <= free);
  const run = async (code, table) => { setBusy(true); await assign(code, table); setBusy(false); setPick(''); };
  return html`
    <${Modal} onClose=${onClose}>
      <p className=${kicker}>Plan de table</p>
      <div className="mt-2 flex items-end justify-between gap-4">

            : html`<h2 className="mt-1 flex items-center gap-2 font-display text-4xl font-light"><span className="gold-text truncate">${t.name}</span>

        </div>

        ${!t.guests.length && html`<li className="rounded-2xl border border-dashed border-ivoire/10 px-4 py-6 text-center text-sm text-ivoire/45">Personne à cette table pour l’instant.</li>`}

          <p className="mb-2 text-[11px] font-medium uppercase tracking-[0.18em] text-ivoire/50">Placer un invité (${plural(free, 'place')} libre${free > 1 ? 's' : ''})</p>
          ${candidates.length ? html`
            <div className="flex gap-2">
              <select className="field" value=${pick} onChange=${(e) => setPick(e.target.value)}>
                <option value="">Choisir un invité sans table…</option>
                ${candidates.map((g) => html`<option key=${g.code} value=${g.code}>${g.prenom} ${g.nom} (${g.personnes || 1})</option>`)}
              </select>
              <button className=${btnGold + ' shrink-0'} disabled=${!pick || busy} onClick=${() => run(pick, n)}>Placer</button>
            </div>`
          : html`<p className="text-sm text-ivoire/45">Aucun invité sans table ne rentre dans les places restantes.</p>`}

    <//>`;
}

/* =====================================================================
   Import Excel : Nom, Prénom, Téléphone (facultatif), Nombre de personnes (1 ou 2), Statut
   ===================================================================== */
const COLS = { nom: ['nom', 'name', 'lastname'], prenom: ['prenom', 'prenoms', 'firstname'], telephone: ['telephone', 'tel', 'phone', 'portable', 'whatsapp', 'numero'],
  personnes: ['nombredepersonnes', 'nombredepersonne', 'nombre', 'personnes', 'personne', 'nb', 'nbpersonnes'], presence: ['statut', 'status', 'presence'],
  billet: ['billetphysique', 'billetpapier', 'billet', 'papier'] };
const ORDER = ['nom', 'prenom', 'telephone', 'personnes', 'presence', 'billet'];
const BILLET_IN = { oui: true, o: true, x: true, '1': true, yes: true, remis: true, donne: true, non: false, n: false, '0': false, no: false, '': false };
const STATUT_IN = { oui: 'oui', confirme: 'oui', confirmee: 'oui', present: 'oui', presente: 'oui', non: 'non', absent: 'non', absente: 'non',
  attente: 'attente', enattente: 'attente', aconfirmer: 'attente', invite: 'attente', invitee: 'attente', '': 'attente' };
const key = (v) => fold(v).replace(/[^a-z]/g, '');

function parseSheet(aoa, existing) {
  const rows = aoa.filter((r) => r && r.some((c) => String(c ?? '').trim() !== ''));
  if (!rows.length) return [];
  // En-têtes reconnus ? sinon on suppose l'ordre Nom, Prénom, Téléphone, Nombre, Statut
  const head = rows[0].map(key);
  const idx = {};
  ORDER.forEach((f) => { const i = head.findIndex((h) => COLS[f].includes(h)); if (i >= 0) idx[f] = i; });
  const hasHeader = idx.nom !== undefined && idx.prenom !== undefined;
  if (!hasHeader) ORDER.forEach((f, i) => { idx[f] = i; });
  const seen = new Set(existing.map((g) => fold(g.prenom + ' ' + g.nom).trim()));
  return rows.slice(hasHeader ? 1 : 0).map((r, i) => {
    const get = (f) => (idx[f] === undefined ? '' : String(r[idx[f]] ?? '').trim());
    const raw = fold(get('personnes')).replace(/[^a-z0-9]/g, '');
    const personnes = raw === '' || raw === '1' || raw === 'seul' || raw === 'seule' ? 1 : raw === '2' || raw === 'couple' || raw === 'encouple' ? 2 : NaN;
    const st = key(get('presence'));
    const billet = fold(get('billet')).replace(/[^a-z0-9]/g, '');
    const row = { line: i + (hasHeader ? 2 : 1), nom: get('nom'), prenom: get('prenom'), telephone: get('telephone'), personnes, presence: STATUT_IN[st], billetPhysique: BILLET_IN[billet] };
    const errs = [];
    if (row.billetPhysique === undefined) errs.push(`billet physique « ${get('billet')} » : mettez Oui ou Non`);
    if (!row.nom || !row.prenom) errs.push('nom ou prénom manquant');
    if (!personnes) errs.push(`« ${get('personnes')} » : mettez 1 ou 2`);
    if (!row.presence) errs.push(`statut « ${get('presence')} » inconnu`);
    const k = fold(row.prenom + ' ' + row.nom).trim();
    if (!errs.length && seen.has(k)) errs.push('déjà dans la liste');
    if (!errs.length) seen.add(k);
    return { ...row, errs };
  });
}

function ImportModal({ onClose, onDone }) {
  const [rows, setRows] = useState(null);
  const [file, setFile] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState(null);
  const [drag, setDrag] = useState(false);
  const input = useRef(null);

  const read = async (f) => {
    if (!f) return;
    setErr(''); setResult(null); setFile(f.name);
    try {
      if (!window.XLSX) throw new Error('Lecteur Excel indisponible (connexion ?).');
      const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
      const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
      const { guests } = await api('/api/guests');
      const parsed = parseSheet(aoa, guests);
      if (!parsed.length) throw new Error('Le fichier est vide.');
      setRows(parsed);
    } catch (e) { setRows(null); setErr(e.message || 'Fichier illisible.'); }
  };
  const template = () => {
    const ws = XLSX.utils.aoa_to_sheet([['Nom', 'Prénom', 'Téléphone', 'Nombre de personnes', 'Statut', 'Billet physique'], ['Mfonzie', 'Jean', '699112233', 2, 'Confirmé', 'Oui'], ['Ndam', 'Awa', '', 1, 'À confirmer', 'Non']]);
    ws['!cols'] = [{ wch: 18 }, { wch: 18 }, { wch: 16 }, { wch: 20 }, { wch: 14 }, { wch: 16 }];
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Invités');
    XLSX.writeFile(wb, 'modele-invites-annie-daniel.xlsx');
  };
  const good = rows ? rows.filter((r) => !r.errs.length) : [];
  const bad = rows ? rows.filter((r) => r.errs.length) : [];
  const send = async () => {
    setBusy(true); setErr('');

      const d = await api('/api/guests', { method: 'POST', body: JSON.stringify({ action: 'import', rows: good.map(({ errs, ...r }) => r) }) });

      ${result ? html`
        <div className="mt-6 rounded-3xl border border-emeraude-400/30 bg-emeraude-400/10 p-6 text-center">
          <p className="font-display text-5xl text-emeraude-300 tnum">${result.created}</p>
          <p className="mt-1 text-sm text-ivoire/70">${result.created > 1 ? 'invités importés' : 'invité importé'}${result.skipped.length ? ` · ${result.skipped.length} ignoré(s)` : ''}</p>
          ${result.skipped.length > 0 && html`<ul className="mt-3 text-xs text-or-200/80">${result.skipped.map((x) => html`<li key=${x.line}>Ligne ${x.line} : ${x.reason}</li>`)}</ul>`}
          <button className=${btnGold + ' mt-5'} onClick=${onClose}>Terminer</button>
        </div>`
      : html`
        <div onClick=${() => input.current.click()} onDragOver=${(e) => { e.preventDefault(); setDrag(true); }} onDragLeave=${() => setDrag(false)}
          onDrop=${(e) => { e.preventDefault(); setDrag(false); read(e.dataTransfer.files[0]); }}
          className=${'mt-6 flex cursor-pointer flex-col items-center justify-center gap-2 rounded-3xl border-2 border-dashed px-6 py-8 text-center transition ' + (drag ? 'border-or-300 bg-or-300/10' : 'border-ivoire/15 hover:border-or-300/50')}>
          <span className="flex h-12 w-12 items-center justify-center rounded-full bg-or-300/10 text-or-200"><${Icon} name="csv" className="h-6 w-6" /></span>
          <p className="text-sm">${file || 'Déposez votre fichier ici ou cliquez pour le choisir'}</p>
          <p className="text-xs text-ivoire/40">.xlsx, .xls ou .csv</p>
          <input ref=${input} type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange=${(e) => { read(e.target.files[0]); e.target.value = ''; }} />
        </div>

        ${rows && html`

            <span className="rounded-full bg-emeraude-400/15 px-3 py-1 text-emeraude-300 ring-1 ring-emeraude-400/30">${plural(good.length, 'ligne')} prête${good.length > 1 ? 's' : ''}</span>
            ${bad.length > 0 && html`<span className="rounded-full bg-red-500/10 px-3 py-1 text-red-300 ring-1 ring-red-400/25">${plural(bad.length, 'ligne')} à corriger (ignorée${bad.length > 1 ? 's' : ''})</span>`}

          </div>
          <div className="scroll-thin mt-3 max-h-[45vh] overflow-auto rounded-2xl border border-ivoire/10">
            <table className="w-full text-left text-xs">
              <thead className="sticky top-0 bg-nuit-700 text-[10px] uppercase tracking-widest text-ivoire/50">
                <tr>${['Ligne', 'Nom', 'Prénom', 'Téléphone', 'Pers.', 'Statut', 'Papier', ''].map((h) => html`<th key=${h} className="px-3 py-2 font-medium">${h}</th>`)}</tr>
              </thead>
              <tbody>
                ${rows.map((r) => html`
                  <tr key=${r.line} className=${'border-t border-ivoire/5 ' + (r.errs.length ? 'bg-red-500/[0.07]' : '')}>

                    <td className="tnum px-3 py-2 text-ivoire/60">${r.telephone}</td>
                    <td className="px-3 py-2">${r.personnes === 2 ? 'Couple' : r.personnes === 1 ? 'Seul(e)' : '—'}</td>
                    <td className="px-3 py-2">${r.presence ? html`<${Status} p=${r.presence} />` : '—'}</td>
                    <td className="px-3 py-2 text-ivoire/60">${r.billetPhysique ? 'Oui' : r.billetPhysique === false ? 'Non' : '—'}</td>

        ${err && html`<p className="mt-4 rounded-2xl bg-red-500/10 px-4 py-3 text-sm text-red-200">${err}</p>`}
        <div className="mt-5 flex justify-end gap-2">
          <button className=${btnLine} onClick=${onClose}>Annuler</button>
          <button className=${btnGold} disabled=${!good.length || busy} onClick=${send}>${busy ? 'Import en cours…' : `Importer ${plural(good.length, 'invité')}`}</button>
        </div>`}
    <//>`;
}

function Scanner() {
  const video = useRef(null);
  const [on, setOn] = useState(false);
  const [camErr, setCamErr] = useState('');
  const [result, setResult] = useState(null); // { guest, alreadyCheckedIn } | { error }
  const [manual, setManual] = useState('');
  const lock = useRef(false);

  const check = async (text) => {
    lock.current = true;
    try { setResult(await api('/api/guests', { method: 'POST', body: JSON.stringify({ action: 'checkin', code: text }) })); }
    catch (e) { setResult({ error: e.message }); }
    if (navigator.vibrate) navigator.vibrate(120);
  };

  useEffect(() => {
    if (!on) return;
    let stream, raf, stopped = false;
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    (async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        if (stopped) return stream.getTracks().forEach((t) => t.stop());
        video.current.srcObject = stream;
        await video.current.play();
        const tick = () => {
          if (stopped) return;
          const v = video.current;
          if (!lock.current && v && v.readyState >= 2 && v.videoWidth) {
            canvas.width = v.videoWidth; canvas.height = v.videoHeight;
            ctx.drawImage(v, 0, 0);
            const r = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height, { inversionAttempts: 'dontInvert' });
            if (r && r.data) check(r.data);
          }
          raf = requestAnimationFrame(tick);
        };
        tick();
      } catch (e) {
        setCamErr('Caméra inaccessible. Autorisez la caméra (le site doit être ouvert en https) ou saisissez le code ci-dessous.');
        setOn(false);
      }
    })();
    return () => { stopped = true; cancelAnimationFrame(raf); stream && stream.getTracks().forEach((t) => t.stop()); };
  }, [on]);

  const next = () => { setResult(null); lock.current = false; };
  const g = result && result.guest;
  const tone = result && (result.error ? 'bg-red-600' : result.alreadyCheckedIn ? 'bg-amber-500' : 'bg-emeraude-600');

  return html`
    <div className="mx-auto max-w-md">
      <div className="relative overflow-hidden rounded-[28px] border border-ivoire/10 bg-black shadow-2xl">
        <video ref=${video} playsInline muted className=${'aspect-square w-full object-cover ' + (on ? '' : 'hidden')}></video>
        ${!on && html`<div className="flex aspect-square flex-col items-center justify-center gap-5 p-6 text-center">
          <span className="flex h-16 w-16 items-center justify-center rounded-full bg-or-300/10 text-or-200 ring-1 ring-or-300/30"><${Icon} name="scan" className="h-7 w-7" /></span>
          <p className="max-w-xs text-sm text-ivoire/60">Scannez le QR code du billet à l’entrée pour accueillir l’invité et lui indiquer sa table.</p>
          <button className=${btnGold} onClick=${() => { setCamErr(''); setOn(true); }}>Activer la caméra</button></div>`}
        ${on && !result && html`<div className="pointer-events-none absolute inset-[18%] rounded-3xl border-2 border-or-300/80 shadow-[0_0_0_999px_rgba(0,0,0,.35)]"></div>`}
        ${result && html`
          <div className=${'absolute inset-0 flex flex-col items-center justify-center p-6 text-center text-white ' + tone}>
            ${result.error ? html`<p className="text-2xl font-semibold">✕ ${result.error}</p>` : html`
              <p className="text-xs uppercase tracking-[0.3em] opacity-80">${result.alreadyCheckedIn ? 'Déjà scanné' : 'Bienvenue'}</p>
              <p className="mt-2 font-display text-4xl">${g.prenom} ${g.nom}</p>
              <p className="mt-1 text-base opacity-90">${plural(g.personnes || 1, 'personne')} · ${g.code}</p>
              <div className="mt-5 rounded-3xl bg-white/15 px-8 py-3"><p className="tnum text-[10px] uppercase tracking-[0.3em] opacity-80">${g.table ? `Table n° ${g.table}` : 'Table'}</p><p className="font-display text-5xl leading-tight">${g.table ? (g.tableName || NAMES[g.table]) : '—'}</p></div>
              ${result.alreadyCheckedIn && html`<p className="mt-3 text-sm">Entré(e) le ${fmtTime(g.checkedInAt)}</p>`}
              ${g.presence === 'non' && html`<p className="mt-2 text-sm font-semibold">⚠ Noté « absent »</p>`}`}
            <button className="mt-6 rounded-full bg-white px-6 py-2.5 text-sm font-semibold text-nuit" onClick=${next}>Scanner le suivant</button>
          </div>`}
      </div>
      ${camErr && html`<p className="mt-4 rounded-2xl bg-red-500/10 px-4 py-3 text-sm text-red-200">${camErr}</p>`}
      <form className="mt-4 flex gap-2" onSubmit=${(e) => { e.preventDefault(); if (manual.trim()) { check(manual); setManual(''); } }}>
        <input className="field uppercase placeholder:normal-case" value=${manual} onChange=${(e) => setManual(e.target.value)} placeholder="Ou saisir le code AD-XXXXXX" />
        <button className=${btnLine + ' shrink-0'}>Valider</button>
      </form>
      ${on && html`<p className="mt-3 text-center"><button className="text-sm text-or-200 underline" onClick=${() => setOn(false)}>Arrêter la caméra</button></p>`}
    </div>`;
}

const NAV = [['home', 'Aperçu', 'home'], ['guests', 'Invités', 'users'], ['tables', 'Tables', 'table'], ['scan', 'Scanner', 'scan']];

function App() {
  const [ok, setOk] = useState(Boolean(getKey()));
  const [view, setView] = useState('home');
  const [filter, setFilter] = useState('all');
  const [data, setData] = useState(null);
  const [err, setErr] = useState('');
  const [share, setShare] = useState(null);   // code
  const [form, setForm] = useState(null);     // { guest? }
  const [table, setTable] = useState(null);   // numéro
  const [note, setNote] = useState('');
  const [importing, setImporting] = useState(false);

  const toast = useCallback((m) => { setNote(m); clearTimeout(toast.t); toast.t = setTimeout(() => setNote(''), 2600); }, []);
  const logout = () => { setKey(''); setOk(false); setData(null); };
  const load = useCallback(async () => {
    try { const d = await api('/api/guests'); d.plan.list.forEach((t) => { NAMES[t.n] = t.name; }); setData(d); setErr(''); }
    catch (e) { if (e.status === 401) logout(); else setErr(e.message); }
  }, []);
  useEffect(() => { if (ok) load(); }, [ok]);

  if (!ok) return html`<${Login} onOk=${() => setOk(true)} />`;

  const go = (v, f) => { setView(v); if (f) setFilter(f); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  const del = async (g) => {
    if (!confirm(`Supprimer l’invitation de ${g.prenom} ${g.nom} (${g.code}) ?`)) return;
    try { await api('/api/guests?code=' + encodeURIComponent(g.code), { method: 'DELETE' }); toast('Invitation supprimée'); load(); }
    catch (e) { toast(e.message); }
  };
  const assign = async (code, n) => {
    try { await api('/api/guests?code=' + encodeURIComponent(code), { method: 'PATCH', body: JSON.stringify({ table: n }) }); await load(); toast(n ? `Placé à la table ${n}` : 'Retiré de la table'); }
    catch (e) { toast(e.message); }
  };
  const rename = async (n, name) => {
    try { const d = await api('/api/guests', { method: 'POST', body: JSON.stringify({ action: 'tableName', table: n, name }) }); await load(); toast(`Table ${n} : ${d.name}`); return true; }
    catch (e) { toast(e.message); return false; }
  };
  const saved = (g, created) => { setForm(null); load(); toast(created ? 'Billet créé ✨' : 'Modifications enregistrées'); if (created) setShare(g.code); };

        <p className="mt-1 text-[10px] uppercase tracking-[0.3em] text-ivoire/40">12 · 12 · 2026</p>
        <nav className="mt-10 space-y-1">
          ${NAV.map(([k, l, ic]) => html`<button key=${k} onClick=${() => go(k)}
            className=${'flex w-full items-center gap-3 rounded-2xl px-4 py-3 text-sm transition ' + (view === k ? 'bg-or-300/10 font-medium text-or-100 ring-1 ring-or-300/20' : 'text-ivoire/60 hover:bg-ivoire/5 hover:text-ivoire')}>
            <${Icon} name=${ic} className="h-[18px] w-[18px]" />${l}</button>`)}
        </nav>
        <button className=${btnGold + ' mt-8'} onClick=${() => setForm({})}><${Icon} name="plus" />Ajouter un invité</button>
        <button className=${btnLine + ' mt-3'} onClick=${() => setImporting(true)}><${Icon} name="csv" />Importer un Excel</button>
        <button className="mt-auto flex items-center gap-2 text-sm text-ivoire/45 hover:text-ivoire" onClick=${logout}><${Icon} name="logout" />Déconnexion</button>
      </aside>

      <div className="lg:pl-64">
        <header className="sticky top-0 z-20 flex items-center gap-3 border-b border-ivoire/5 bg-nuit/70 px-4 py-3 backdrop-blur-xl sm:px-8 lg:py-5">
          <p className="font-script text-3xl text-or-200 lg:hidden">A & D</p>
          <h1 className="hidden font-display text-3xl font-light lg:block">${title}</h1>
          <div className="ml-auto flex items-center gap-2">
            <button className=${btnLine + ' !px-3 lg:hidden'} onClick=${() => setImporting(true)} title="Importer un Excel"><${Icon} name="csv" /><span className="hidden sm:inline">Importer</span></button>
            <button className=${btnGold + ' !px-4'} onClick=${() => setForm({})}><${Icon} name="plus" /><span className="hidden sm:inline">Ajouter un invité</span><span className="sm:hidden">Ajouter</span></button>
            <button className=${iconBtn + ' lg:hidden'} onClick=${logout} title="Déconnexion"><${Icon} name="logout" /></button>
          </div>
        </header>

        <main className="mx-auto max-w-6xl px-4 pb-32 pt-6 sm:px-8 lg:pb-16">
          <h1 className="mb-5 font-display text-3xl font-light lg:hidden">${title}</h1>
          ${err && html`<p className="mb-4 rounded-2xl bg-red-500/10 px-4 py-3 text-sm text-red-200">${err} <button className="underline" onClick=${load}>Réessayer</button></p>`}
          ${view === 'scan' ? html`<${Scanner} />`
            : !data ? !err && html`<div className="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">${[0, 1, 2, 3].map((i) => html`<div key=${i} className="card h-36 animate-pulse"></div>`)}</div>`
            : view === 'home' ? html`<${Overview} data=${data} go=${go} />`
            : view === 'guests' ? html`<${Guests} data=${data} filter=${filter} setFilter=${setFilter} onShare=${setShare} onEdit=${(g) => setForm({ guest: g })} onDelete=${del} toast=${toast} />`
            : html`<${Tables} data=${data} onOpen=${setTable} />`}
        </main>
      </div>

      <nav className="fixed inset-x-3 bottom-3 z-30 flex rounded-full border border-ivoire/10 bg-nuit-800/90 p-1.5 shadow-2xl backdrop-blur-xl lg:hidden" style=${{ marginBottom: 'env(safe-area-inset-bottom)' }}>
        ${NAV.map(([k, l, ic]) => html`<button key=${k} onClick=${() => go(k)}
          className=${'flex flex-1 flex-col items-center gap-0.5 rounded-full py-2 text-[10px] transition ' + (view === k ? 'bg-or-300 font-semibold text-nuit' : 'text-ivoire/60')}>
          <${Icon} name=${ic} className="h-[18px] w-[18px]" />${l}</button>`)}
      </nav>

      ${form && data && html`<${GuestForm} guest=${form.guest} plan=${data.plan} onClose=${() => setForm(null)} onSaved=${saved} />`}
      ${share && html`<${ShareModal} code=${share} onClose=${() => setShare(null)} onChanged=${load} toast=${toast} />`}
      ${table && data && html`<${TableModal} n=${table} data=${data} onClose=${() => setTable(null)} assign=${assign} rename=${rename} onShare=${(c) => { setTable(null); setShare(c); }} />`}
      ${importing && html`<${ImportModal} onClose=${() => setImporting(false)} onDone=${(n) => { load(); if (n) toast(`${plural(n, 'invité')} importé${n > 1 ? 's' : ''} ✨`); }} />`}
      ${note && html`<div className="pop fixed bottom-24 left-1/2 z-[60] -translate-x-1/2 rounded-full border border-or-300/30 bg-nuit-700 px-5 py-2.5 text-sm text-or-100 shadow-2xl lg:bottom-8">${note}</div>`}
    </div>`;
}

</script>
